# Checks the gem against ClickSend's published OpenAPI files (public; no
# credentials). Runs weekly to catch API documentation drift, and on PRs.
name: Contract

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake contract
