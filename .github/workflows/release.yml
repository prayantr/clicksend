# Publishes the gem to RubyGems with Trusted Publishing (OIDC, no stored API
# key). Manual only, and gated by the "rubygems" environment, which accepts
# runs from v* tags only. The trusted publisher is configured on rubygems.org
# for this repository, this workflow file and that environment.
#
# Release process (see CONTRIBUTING.md): merge the version bump into master,
# push an annotated vX.Y.Z tag on that commit, then run this workflow from the
# tag. `rake release` finds the existing tag, so it skips tagging and only
# builds and pushes the gem. This workflow never creates or pushes tags.
#
# These workflows hold the RubyGems publishing credential, so every action is
# pinned to a commit SHA (version in the trailing comment). To update one,
# pin the commit of the new release tag, e.g.
#   gh api repos/OWNER/REPO/commits/vX.Y.Z --jq .sha
name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read # never pushes: the tag already exists
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
