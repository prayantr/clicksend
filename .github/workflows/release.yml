# Publishes the gem to RubyGems with Trusted Publishing (OIDC, no stored API
# key). Manual only, and gated by the "rubygems" environment, which accepts
# runs from v* tags only. The trusted publisher is configured on rubygems.org
# for this repository, this workflow file and that environment.
#
# Release process (see CONTRIBUTING.md): merge the version bump into master,
# push an annotated vX.Y.Z tag on that commit, then run this workflow from the
# tag. `rake release` finds the existing tag, so it skips tagging and only
# builds and pushes the gem. This workflow never creates or pushes tags.
name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec
      - uses: rubygems/release-gem@v1
